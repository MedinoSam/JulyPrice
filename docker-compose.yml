services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: julyprice
      POSTGRES_PASSWORD: julyprice
      POSTGRES_DB: julyprice
    ports:
      - "5433:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
